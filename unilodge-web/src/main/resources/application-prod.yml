# Production profile. Everything sensitive comes from environment variables.
# Required: DB credentials, JWT_SECRET.
# Optional: APP_URL (falls back to Render's RENDER_EXTERNAL_URL),
#           MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM.
# If no SMTP host is configured, emails (including OTP codes) are written to
# the server log so the first administrator can still complete setup.
spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    show-sql: false
  flyway:
    clean-disabled: true

app:
  mail:
    mode: ${MAIL_MODE:smtp}
    from: ${MAIL_FROM:no-reply@unilodge.local}
    app-url: ${APP_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
    expose-otp: false
  bootstrap:
    # This deployment is a public demo, so sample accounts, 18 listings and
    # student-board posts are seeded by default. Set DEMO_DATA=false to serve
    # an empty production catalogue instead.
    demo-data: ${DEMO_DATA:true}
  cors:
    allowed-origins: ${CORS_ORIGINS:}

logging:
  level:
    root: INFO
    com.unilodge: INFO
    org.springframework.web: WARN
  file:
    name: ${LOG_FILE:logs/unilodge.log}
